apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aliyun-nsg-updater.fullname" . }}-config
  labels:
    {{- include "aliyun-nsg-updater.labels" . | nindent 4 }}
    {{- with .Values.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with .Values.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
{{- if .Values.rules }}
    rules:
{{- range .Values.rules }}
      - security_group_id: {{ .securityGroupId | quote }}
        direction: {{ .direction | quote }}
        protocol: {{ .protocol | quote }}
        port_range: {{ .portRange | quote }}
{{- if .priority }}
        priority: {{ .priority | quote }}
{{- end }}
{{- if .nicType }}
        nic_type: {{ .nicType | quote }}
{{- end }}
{{- if .policy }}
        policy: {{ .policy | quote }}
{{- end }}
        description: {{ .description | quote }}
{{- end }}
{{- else }}
    rules: []
{{- end }}
